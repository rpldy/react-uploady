packages:
  - "packages/core/*"
  - "packages/ui/*"
  - "packages/native/*"
linkWorkspacePackages: true

# flow-bin requires hoisting of these deps to root node_modules
publicHoistPattern:
  - invariant
  - html-dir-content
  - react-dnd
  - react-image-crop

# pnpm 10+ runs install scripts only for listed deps (Cypress binary, native addons, etc.).
onlyBuiltDependencies:
  - core-js
  - core-js-pure
  - cypress
  - esbuild
  - nx
  - weak-napi

# minimum release age: 10 days (14400 minutes)
minimumReleaseAge: 14400

overrides:
  "@typescript-eslint/utils": "^8.57.2"
  # keep a single webpack instance - storybook's webpack5 builder resolving
  # a different minor than root's own devDependency breaks `instanceof`
  # checks across the split (e.g. DefinePlugin.getCompilationHooks)
  "webpack": "^5.108.4"
  # security: same-major patched versions for transitive deps (pnpm audit)
  "brace-expansion@^2.0.0": "^2.1.7"
  "undici@^7.0.0": "^7.30.1"

allowBuilds:
  core-js: true
  core-js-pure: true
  cypress: true
  esbuild: true
  nx: true
  weak-napi: true
  # netlify-cli (storybook publish) - none of these are needed for a static deploy,
  # and leaving them undecided fails install with ERR_PNPM_IGNORED_BUILDS
  netlify-cli: false
  sharp: false
  unix-dgram: false
